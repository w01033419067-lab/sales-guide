<style id="wgGateTheme">
  /* 비밀번호 입력 화면 — 본문과 같은 디자인 (Pretendard · 회색 바탕 · 흰 카드) */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
         background:#F2F4F6; background-image:linear-gradient(180deg, #12305C 0, #1E4C8F 240px, #F2F4F6 240px);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         letter-spacing:-0.01em; word-break:keep-all; -webkit-font-smoothing:antialiased; color:#333D4B; }
  .gate { background:#fff; border-radius:24px; padding:40px 32px 30px; width:100%; max-width:400px;
          box-shadow:0 2px 4px rgba(0,25,70,.04), 0 18px 48px rgba(0,25,70,.14); text-align:center; }
  .logo { width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg, #12305C 0%, #1E4C8F 100%); color:#fff;
          display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
          font-size:26px; font-weight:800; box-shadow:0 6px 16px rgba(30,76,143,.28); }
  h1 { font-size:22px; font-weight:800; color:#191F28; letter-spacing:-0.03em; }
  h1 + p[style] { display:inline-block !important; margin:10px 0 0 !important; padding:3px 10px !important; border-radius:8px !important;
                  background:#FFEEEE !important; color:#D22030 !important; font-size:13px !important; font-weight:700 !important; }
  p.sub { font-size:14.5px; color:#4E5968; font-weight:500; margin-top:12px; line-height:1.65; }
  form { margin-top:26px; }
  input { width:100%; font-family:inherit; font-size:16px; padding:15px 16px; text-align:center; letter-spacing:.02em;
          border:1px solid transparent; border-radius:14px; background:#F2F4F6; color:#191F28;
          outline:none; transition:border .15s, background .15s, box-shadow .15s; }
  input::placeholder { color:#8B95A1; letter-spacing:-0.01em; }
  input:focus { border-color:#1E4C8F; background:#fff; box-shadow:0 0 0 4px rgba(30,76,143,.12); }
  button { width:100%; margin-top:10px; font-family:inherit; font-size:16px; font-weight:700; letter-spacing:-0.01em;
           color:#fff; background:#1E4C8F; border:none; padding:15px; border-radius:14px;
           cursor:pointer; transition:background .15s, transform .05s; }
  button:hover { background:#143A70; }
  button:active { transform:scale(.99); }
  button:disabled { background:#A9B8CC; cursor:default; }
  .msg { margin-top:14px; font-size:14px; min-height:20px; font-weight:600; }
  .msg.err { display:inline-block; background:#FFEEEE; color:#D22030; font-weight:700; padding:7px 14px; border-radius:10px; }
  .msg.info { color:#24569E; }
  .notice { margin-top:20px; padding:14px 16px; background:#F7F8FA; border:1px solid #E5E8EB; border-radius:14px; text-align:left;
            font-size:13px; color:#4E5968; font-weight:500; line-height:1.7; }
  .notice b { display:block; color:#191F28; font-weight:700; font-size:13.5px; margin-bottom:4px; }
  .foot { margin-top:18px; font-size:12.5px; color:#8B95A1; font-weight:500; line-height:1.7; }
  .foot strong { color:#4E5968; font-weight:700; }
  /* PC 글씨 105% — 정수 px 로 (화면 확대 대신) */
  @media (min-width: 1200px) and (hover: hover) and (pointer: fine) {
    .gate { max-width:416px; }
    h1 { font-size:23px; } h1 + p[style] { font-size:14px !important; }
    p.sub { font-size:15px; } input, button { font-size:17px; } .msg { font-size:15px; }
    .notice { font-size:14px; } .notice b { font-size:14px; } .foot { font-size:13px; }
  }
</style>
</head>

<div class="gate">
  <div class="logo">W</div>
  <h1>협력점 유선 세일즈 가이드</h1><p style="margin:6px 0 0;font-size:12.5px;font-weight:800;color:#A32D2D;">미리보기 (검토용)</p>
  <p class="sub">내부 자료입니다.<br/>발급받으신 비밀번호를 입력해 주세요.</p>

    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus/>

<script>
(function(){
  var B = JSON.parse(document.getElementById('payload').textContent);
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg');
  function b2u(b){ var s = atob(b), a = new Uint8Array(s.length);
                   for (var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
  function open_(html){
    document.open(); document.write(html); document.close();
  }
  function unlock(pass, silent){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(k){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:b2u(B.s), iterations:B.it, hash:'SHA-256' },
          k, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:'AES-GCM', iv:b2u(B.i) }, key, b2u(B.d));
      })
      .then(function(buf){
        try { sessionStorage.setItem('wg_pw', pass); } catch(e){}
        open_(new TextDecoder().decode(buf));
      })
      .catch(function(){
        try { sessionStorage.removeItem('wg_pw'); } catch(e){}
        if (!silent){ msg.className='msg err'; msg.textContent='비밀번호가 올바르지 않습니다.'; }
        go.disabled = false; go.textContent = '열기'; pw.value=''; pw.focus();
      });
  }
  f.addEventListener('submit', function(e){
    e.preventDefault();
    if (!pw.value) return;
    go.disabled = true; go.textContent = '확인 중…';
    msg.className='msg info'; msg.textContent='복호화하는 중입니다…';
    setTimeout(function(){ unlock(pw.value, false); }, 30);
  });
  var saved = null; try { saved = sessionStorage.getItem('wg_pw'); } catch(e){}
  if (saved){ go.disabled = true; msg.className='msg info'; msg.textContent='불러오는 중…'; unlock(saved, true); }
})();
</script>
