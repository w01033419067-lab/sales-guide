<style>

  body { font-family:'Noto Sans KR',sans-serif; background:#143C64;

  .gate { background:#fff; border-radius:16px; padding:40px 34px; width:100%; max-width:380px;
          box-shadow:0 18px 50px rgba(0,0,0,.35); text-align:center; }
  .logo { width:52px; height:52px; border-radius:14px; background:#1F4E8C; color:#fff;

  h1 { font-size:18px; font-weight:800; color:#143C64; letter-spacing:-.3px; }
  p.sub { font-size:12.5px; color:#A32D2D; font-weight:700; margin-top:7px; line-height:1.7; }
  form { margin-top:24px; }
  input { width:100%; font-family:inherit; font-size:15px; padding:12px 14px; text-align:center;
          border:1px solid #A9CCE8; border-radius:10px; background:#F4F8FC; color:#14213D;
          outline:none; transition:border .15s,background .15s; }
  input:focus { border-color:#2E75B6; background:#fff; }
  button { width:100%; margin-top:10px; font-family:inherit; font-size:14px; font-weight:800;
           color:#fff; background:#1F4E8C; border:none; padding:12px; border-radius:10px;
           cursor:pointer; transition:background .15s; }
  button:hover { background:#2E75B6; }
  button:disabled { background:#8FAFCC; cursor:default; }

  .msg.err { display:inline-block; background:#A32D2D; color:#fff; font-weight:800;
             padding:6px 12px; border-radius:8px; }
  .msg.info { color:#2E75B6; }

            font-size:11.5px; color:#8A3232; font-weight:600; line-height:1.75; }
  .notice b { display:block; color:#8E1F1F; font-weight:800; font-size:12px; margin-bottom:3px; }
  .foot { margin-top:16px; font-size:11.5px; color:#95403F; font-weight:600; line-height:1.7; }
  .foot strong { color:#8E1F1F; font-weight:800; }

<body>
<div class="gate">
  <div class="logo">W</div>
  <h1>협력점 유선 세일즈 가이드</h1>
  <p class="sub">내부 자료입니다.<br/>발급받으신 비밀번호를 입력해 주세요.</p>

    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus/>

  </form>

  <div class="notice">

  </div>

<script>
(function(){
  var B = JSON.parse(document.getElementById('payload').textContent);
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg');
  function b2u(b){ var s = atob(b), a = new Uint8Array(s.length);
                   for (var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
  function open_(html){
    document.open(); document.write(html); document.close();
  }
  function unlock(pass, silent){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(k){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:b2u(B.s), iterations:B.it, hash:'SHA-256' },
          k, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:'AES-GCM', iv:b2u(B.i) }, key, b2u(B.d));
      })
      .then(function(buf){
        try { sessionStorage.setItem('wg_pw', pass); } catch(e){}
        open_(new TextDecoder().decode(buf));
      })
      .catch(function(){
        try { sessionStorage.removeItem('wg_pw'); } catch(e){}
        if (!silent){ msg.className='msg err'; msg.textContent='비밀번호가 올바르지 않습니다.'; }
        go.disabled = false; go.textContent = '열기'; pw.value=''; pw.focus();
      });
  }
  f.addEventListener('submit', function(e){
    e.preventDefault();
    if (!pw.value) return;
    go.disabled = true; go.textContent = '확인 중…';
    msg.className='msg info'; msg.textContent='복호화하는 중입니다…';
    setTimeout(function(){ unlock(pw.value, false); }, 30);
  });
  var saved = null; try { saved = sessionStorage.getItem('wg_pw'); } catch(e){}
  if (saved){ go.disabled = true; msg.className='msg info'; msg.textContent='불러오는 중…'; unlock(saved, true); }
})();
</script>
